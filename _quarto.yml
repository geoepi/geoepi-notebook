project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "start/index.qmd"
    - "organization/index.qmd"
    - "organization/project-hub.qmd"
    - "organization/projects-and-subprojects.qmd"
    - "organization/add-project-or-subproject.qmd"
    - "organization/repositories.qmd"
    - "data/index.qmd"
    - "data/data-management-plans.qmd"
    - "data/controlled-data.qmd"
    - "data/analytical-provenance.qmd"
    - "compute/index.qmd"
    - "compute/atlas-ceres.qmd"
    - "compute/repository-vs-compute.qmd"
    - "tools/index.qmd"
    - "tools/github.qmd"
    - "tools/overleaf.qmd"
    - "tools/zotero.qmd"
    - "tools/osf.qmd"
    - "templates/index.qmd"
    - "resources/index.qmd"
    - "about/purpose.qmd"
    - "about/how-to-use.qmd"
    - "about/contributing.qmd"
  resources:
    - "templates/project-overview-template.md"
    - "templates/data-management-plan-template.md"
    - "templates/controlled-data-inventory-template.csv"
    - "templates/subproject-registry-template.yml"
    - "templates/subproject-readme-template.md"
    - "templates/geoepi-metadata-template.yml"
website:
  title: "GeoEpi Lab Book"
  description: "Practical guidance for organizing collaborative geographical epidemiology."
  favicon: assets/images/favicon.ico
  site-url: "https://geoepi.github.io/geoepi-notebook/"
  repo-url: "https://github.com/geoepi/geoepi-notebook"
  repo-actions: [edit, issue, source]
  reader-mode: true
  page-navigation: true
  search: true
  navbar:
    background: "#17324d"
    foreground: white
    logo: assets/images/geoepi_logo_xsm.png
    logo-alt: "GeoEpi"
    logo-href: https://geoepi.github.io/geoepi-notebook/
    left:
      - text: "Start Here"
        href: start/index.qmd
      - text: "How GeoEpi Organizes Work"
        href: organization/index.qmd
      - text: "Data Management"
        href: data/index.qmd
      - text: "Computing & Repositories"
        href: compute/index.qmd
      - text: "Tools & Collaboration"
        href: tools/index.qmd
      - text: "Templates"
        href: templates/index.qmd
      - text: "Resources"
        href: resources/index.qmd
    right:
      - text: "About"
        menu:
          - text: "Purpose"
            href: about/purpose.qmd
          - text: "How to use this site"
            href: about/how-to-use.qmd
          - text: "Contributing"
            href: about/contributing.qmd
      - icon: github
        href: https://github.com/geoepi/geoepi-notebook
        aria-label: GitHub repository
      - text: "GeoEpi"
        menu:
          - text: "Group website"
            href: https://geoepi.github.io/
          - text: "GitHub organization"
            href: https://github.com/geoepi
  sidebar:
    - id: start
      title: "Start Here"
      contents:
        - start/index.qmd
    - id: organization
      title: "How GeoEpi Organizes Work"
      contents:
        - organization/index.qmd
        - organization/project-hub.qmd
        - organization/projects-and-subprojects.qmd
        - organization/add-project-or-subproject.qmd
        - organization/repositories.qmd
    - id: data
      title: "Data Management"
      contents:
        - data/index.qmd
        - data/data-management-plans.qmd
        - data/controlled-data.qmd
        - data/analytical-provenance.qmd
    - id: compute
      title: "Computing & Repositories"
      contents:
        - compute/index.qmd
        - compute/atlas-ceres.qmd
        - compute/repository-vs-compute.qmd
    - id: tools
      title: "Tools & Collaboration"
      contents:
        - tools/index.qmd
        - tools/github.qmd
        - tools/overleaf.qmd
        - tools/zotero.qmd
        - tools/osf.qmd
    - id: templates
      title: "Templates"
      contents:
        - templates/index.qmd
    - id: resources
      title: "Resources"
      contents:
        - resources/index.qmd
    - id: about
      title: "About"
      contents:
        - about/purpose.qmd
        - about/how-to-use.qmd
        - about/contributing.qmd
format:
  html:
    theme:
      - cosmo
      - assets/css/styles.css
    toc: true
    toc-depth: 3
    anchor-sections: true
    code-copy: true
    link-external-newwindow: true
    date-format: iso
